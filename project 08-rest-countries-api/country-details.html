<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Where in the world?</title>
    <link rel="stylesheet" href="./output.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>

  <body class="bg-(--background)">
    <header class="w-full sticky z-100 top-0 shadow-xl bg-(--element)">
      <nav
        class="flex items-center justify-between p-4 min-[500px]:py-6 max-w-350 mx-auto"
      >
        <h1
          class="text-(--primary-text) font-bold text-md min-[500px]:text-2xl"
        >
          Where in the world?
        </h1>
        <div class="theme cursor-pointer text-(--primary-text)" id="theme">
          <div class="light hidden font-medium" id="light">
            <i class="fa-solid fa-sun"></i>
            Light Mode
          </div>
          <div class="dark" id="dark">
            <i class="fa-solid fa-moon"></i>
            Dark Mode
          </div>
        </div>
      </nav>
    </header>

    <main class="max-w-350 mx-auto px-6 py-12">
      <button
        class="bg-(--element) px-6 py-2 rounded-md shadow hover:shadow-lg transition mb-16 cursor-pointer flex items-center gap-2 text-(--primary-text)"
        id="backButton"
      >
        <span> ← </span>Back
      </button>

      <section
        class="grid lg:grid-cols-2 gap-16 items-center"
        id="countryDetail"
      ></section>
    </main>

    <script src="./script.js" type="module"></script>
  </body>
</html>
