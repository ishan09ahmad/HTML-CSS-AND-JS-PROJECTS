<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
    <link rel="stylesheet" href="./style.css" />
    <script src="./script.js" type="module" defer></script>
  </head>
  <body>
    <main>
      <section class="container">
        <div class="search">
          <input type="text" placeholder="Enter City Name" id="input" />

          <img src="./images/search.png" alt="search-icon" id="search-button" />
        </div>

        <div class="error hide" id="error">invalid city name</div>

        <div class="weather-details" id="weather-details">
          <div class="weather">
            <div class="image">
              <img
                src="images/drizzle.png"
                alt="weather-info"
                id="weatherIcon"
              />
            </div>
          </div>

          <div class="temperature-info">
            <p id="temperature"></p>
            <p id="place"></p>
          </div>

          <div class="last">
            <div class="humidity">
              <div class="image">
                <img src="./images/humidity.png" alt="" />
              </div>
              <div class="text">
                <p id="humidity"></p>
                <p>Humidity</p>
              </div>
            </div>
            <div class="wind">
              <div class="image"><img src="./images/wind.png" alt="" /></div>
              <div class="text">
                <p id="wind"></p>
                <p>Wind Speed</p>
              </div>
            </div>
          </div>


        </div>
      </section>
    </main>
  </body>
</html>
